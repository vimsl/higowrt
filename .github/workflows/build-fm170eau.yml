name: Build FM170eau Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false

    steps:
      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils python3-setuptools rsync unzip zlib1g-dev \
            file wget ccache libelf-dev

      - name: Checkout
        uses: actions/checkout@v4

      - name: Update feeds
        run: |
          echo src-git qmodem https://github.com/FUjr/QModem.git;main >> feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          cp defconfig/mt7987_mt7992.config .config
          cat >> .config << 'EOF'
          CONFIG_KPROBES=y
          CONFIG_PACKAGE_kmod-qmi-fix-skb=y
          CONFIG_PACKAGE_luci-app-qmodem-next=y
          CONFIG_PACKAGE_sms-forwarder-next=y
          CONFIG_PACKAGE_sms-tool_q=y
          CONFIG_PACKAGE_socat=y
          EOF
          make defconfig

      - name: Build toolchain (first stage)
        run: |
          make tools/compile -j$(nproc)
          make toolchain/compile -j$(nproc)

      - name: Build firmware
        run: |
          make -j$(nproc) V=s
